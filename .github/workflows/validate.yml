name: Validate 1.0
on:
  push:
    branches: [master, 'codex/1.0']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DB_SERVER: '127.0.0.1'
      DB_PORT: '1'
      DB_DATABASE: build_only
      DB_USER: build_only
      DB_PASSWORD: build-placeholder
      DATABASE_URL: 'sqlserver://127.0.0.1:1;database=build_only;user=build_only;password=build-placeholder;trustServerCertificate=true'
      AUTH_SESSION_SECRET: build-session-placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:api-auth
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
